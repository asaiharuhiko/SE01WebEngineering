schema: spec-driven

context: |
  Tech stack: Django 6.0, HTMX, Python >=3.13, SQLite
  Package management: uv
  Linting/formatting: Ruff
  Testing: pytest with coverage.py
  Domain: Shared blog space web application
  Conventions:
    - Business logic goes in services.py per-app
    - Query/read logic goes in selectors.py per-app
    - Models should define __str__ and Meta
    - Views should be thin; delegate to services/selectors

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
