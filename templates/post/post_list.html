<div id="post-list">
    <ul>
    {% for post in posts %}
        <li><a href="{% url 'post:detail' post.id%}">{{ post.title }}</a></li>
    {% empty %}
        <li>no post</li>
    {% endfor %}
    </ul>

    {% if posts.has_other_pages %}
    <div>
        {% if posts.has_previous %}
            <a href="{{ base_url }}&page={{ posts.previous_page_number }}" hx-get="{{ base_url }}&page={{ posts.previous_page_number }}" hx-target="#post-list" hx-swap="outerHTML"> ← prev</a>
        {% endif %}
        <span>{{ posts.number }}</span>
        {% if posts.has_next %}
            <a href="{{ base_url }}&page={{ posts.next_page_number }}" hx-get="{{ base_url }}&page={{ posts.next_page_number }}" hx-target="#post-list" hx-swap="outerHTML"> next →</a>
        {% endif %}
    </div>
    {% endif %}
</div>
