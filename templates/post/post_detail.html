{% extends "base/base.html" %}

{% block title%}
{{ post.title }} - {{ post.author }}
{% endblock %}

{%block content%}
<h2>{{ post.title }}</h2>
<div><a href="{% url 'post:search' %}?author={{ post.author }}">{{ post.author }}</a> / {{ post.creation_date }}</div>
<div>{{ post.content | linebreaksbr}}</div>
<br>
{% endblock %}
